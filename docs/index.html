<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#100b1d">
  <meta name="description" content="Walk the streets of Japan with RoboBlueCat, archived DJ Quade sets, and live chat.">
  <title>RoboBlueCat Radio</title>
  <link rel="icon" href="assets/cool-cat-crew.webp" type="image/webp">
  <link rel="stylesheet" href="style.css?v=3">
  <script type="module" src="app.js?v=5"></script>
</head>
<body>
  <div class="site" id="site">
    <header class="masthead">
      <a class="wordmark" href="./" aria-label="RoboBlueCat Radio home">
        <img src="assets/cool-cat-crew.webp" alt="Cool Cat Crew" width="42" height="42">
        <h1>RoboBlueCat<span class="wordmark-radio"> Radio</span></h1>
      </a>
    </header>

    <main class="watch-layout">
      <div class="watch">
        <section class="walk" id="walk" aria-label="RoboBlueCat walking through Japan">
          <div class="scene" aria-hidden="true">
            <video id="footage" muted playsinline loop preload="metadata" poster="assets/walk-poster.webp" tabindex="-1" disablepictureinpicture disableremoteplayback></video>
            <div class="grade"></div>
            <div class="texture"></div>
            <div class="vignette"></div>
          </div>
          <img class="cat" src="assets/robobluecat.gif" alt="RoboBlueCat, a blue cat with orange cyber ears, looks down the street." fetchpriority="high">
          <img class="cat cat-still" src="assets/robobluecat-still.webp" alt="" aria-hidden="true">
          <button class="walk-retry outline" id="walk-retry" type="button" hidden>Retry walk</button>
          <button class="cinema-exit outline" id="cinema-exit" type="button">Exit cinema <kbd>Esc</kbd></button>
        </section>
        <div class="walk-toolbar" id="walk-toolbar">
          <span id="walk-status" role="status">Loading the walk</span>
          <div class="walk-controls">
            <button class="outline motion" id="motion" type="button" aria-pressed="false">Pause walk</button>
            <details class="effects">
              <summary class="outline">Effects</summary>
              <div class="effect-settings">
                <label for="intensity">Visual effects</label>
                <output id="intensity-value" for="intensity">78%</output>
                <input id="intensity" type="range" min="0" max="100" value="78">
                <button class="reset" id="reset" type="button">Reset</button>
              </div>
            </details>
            <button class="outline" id="cinema" type="button" aria-pressed="false"><span aria-hidden="true">⛶</span> Cinema</button>
          </div>
        </div>
      </div>

      <section class="radio" id="radio" aria-labelledby="radio-title">
        <div class="radio-heading">
          <h2 id="radio-title">DJ Quade Radio</h2>
          <button class="outline" id="radio-toggle" type="button" aria-expanded="true" aria-controls="radio-panel">Hide YouTube player</button>
        </div>
        <div id="radio-panel">
          <div class="player" id="player"></div>
          <div class="radio-feedback">
            <p id="radio-status" role="status">Tuning in…</p>
            <button class="outline" id="radio-action" type="button" hidden>Enable sound</button>
          </div>
          <a class="external" id="playlist-link" href="https://www.youtube.com/playlist?list=PL7KeUQEsiTQvghfORVy2f2ZTnRG67ONBL" target="_blank" rel="noopener">Open playlist on YouTube <span aria-hidden="true">↗</span></a>
        </div>
      </section>

      <section class="panel chat" id="chat" aria-labelledby="chat-title">
        <div class="panel-heading">
          <div><p class="panel-kicker">LIVE CHAT</p><h2 id="chat-title">The Cat’s Corner</h2></div>
          <span class="chat-status" id="chat-status" role="status">Connecting</span>
        </div>
        <div class="chat-history">
          <p id="chat-empty">Say hello to the other wanderers.</p>
          <ol class="messages" id="messages" role="log" aria-label="Chat messages"></ol>
        </div>
        <form id="chat-form">
          <label class="nick-label" for="nickname">Nickname</label>
          <input id="nickname" type="text" minlength="2" maxlength="24" autocomplete="nickname" required>
          <label class="visually-hidden" for="message">Message</label>
          <input id="message" type="text" maxlength="300" placeholder="Say something…" autocomplete="off" required>
          <button class="send" id="send" type="submit" disabled>Send</button>
        </form>
        <p class="chat-note" id="chat-note" role="status">Messages are public. Be kind and keep personal info private.</p>
      </section>
    </main>

    <footer><span>RoboBlueCat Radio</span><a href="https://twitch.tv/djquade" target="_blank" rel="noopener">DJ Quade on Twitch ↗</a></footer>
  </div>
</body>
</html>
